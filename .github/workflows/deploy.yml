name: Deploy Pujarighar Frontend to VPS

on:
  push:
    branches:
      - main
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Set environment variables
        run: |
          if [ "${{ github.ref_name }}" == "production" ]; then
            echo "DEPLOY_PATH=/var/www/pujarighar.com" >> $GITHUB_ENV
            echo "PM2_NAME=pujarighar" >> $GITHUB_ENV
            echo "PM2_PORT=3003" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.PROD_API_URL }}" >> $GITHUB_ENV
            echo "SITE_URL=https://pujarighar.com" >> $GITHUB_ENV
            echo "GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=/var/www/dev.pujarighar.com" >> $GITHUB_ENV
            echo "PM2_NAME=dev-pujarighar" >> $GITHUB_ENV
            echo "PM2_PORT=3004" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.DEV_API_URL }}" >> $GITHUB_ENV
            echo "SITE_URL=https://dev.pujarighar.com" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ env.GA_ID }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ secrets.NEXT_PUBLIC_DEFAULT_LOCALE }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_APP_ID }}

      - name: Assemble standalone deploy package
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          echo "----- deploy/.next contents -----"
          ls -la deploy/.next/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          # --exclude='.next/cache' protects Next's on-disk image-optimizer
          # cache from --delete — that directory only ever exists on the
          # server (populated at runtime as real requests come in, never
          # part of this build's output), so without the exclude, every
          # deploy was wiping it and forcing every image on the site back
          # to a cold/first-request resize afterward.
          rsync -avz --delete --exclude='.next/cache' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./deploy/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Restart app via PM2
        # Single SSH session (not two back-to-back connections) — opening a
        # second connection immediately after the first was intermittently
        # getting reset during the SSH handshake ("kex_exchange_identification:
        # Connection reset by peer"), likely a connection-rate limit/throttle
        # on the VPS (e.g. sshd MaxStartups or fail2ban) — which failed the
        # whole deploy job even though the restart itself had already
        # succeeded. A retry is also added as a second line of defense for
        # any other transient SSH blip.
        run: |
          for attempt in 1 2 3; do
            ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "pm2 restart ${{ env.PM2_NAME }} || PORT=${{ env.PM2_PORT }} pm2 start ${{ env.DEPLOY_PATH }}/server.js --name ${{ env.PM2_NAME }}; pm2 save" \
              && break
            echo "SSH attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
